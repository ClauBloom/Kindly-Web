<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindly Web</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <path
          d="M12 8h24a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6H26l-8 6v-6h-6a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z"
          fill="currentColor"
        />
        <path d="M17 27q7 5 14 0" stroke="#f4f6f3" stroke-width="2.6" fill="none" stroke-linecap="round" />
      </svg>
      <div class="brand">
        <h1 class="wordmark">Kindly Web</h1>
        <p class="tagline" id="tagline"></p>
      </div>
    </header>

    <main>
      <section id="state-unconfigured" class="state hidden">
        <p class="privacy-note" id="privacy-note"></p>
        <button id="btn-start" class="btn btn-primary"></button>
      </section>

      <section id="state-configured" class="state hidden">
        <div class="toggle-row">
          <span id="toggle-label" class="toggle-label"></span>
          <label class="switch">
            <input type="checkbox" id="toggle" />
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>

        <div class="field">
          <span class="field-label" id="intensity-label"></span>
          <div class="segmented" id="intensity" role="radiogroup"></div>
        </div>

        <div class="field">
          <label class="field-label" for="danmaku-max" id="danmaku-max-label"></label>
          <select id="danmaku-max" class="select"></select>
        </div>

        <div id="warnings" class="warnings hidden"></div>

        <div class="status-card" id="status-card">
          <div class="status-item">
            <span class="status-num" id="st-queue">0</span>
            <span class="status-key" id="st-queue-label"></span>
          </div>
          <div class="status-item">
            <span class="status-num" id="st-inflight">0</span>
            <span class="status-key" id="st-inflight-label"></span>
          </div>
          <div class="status-item">
            <span class="status-num" id="st-failures">0</span>
            <span class="status-key" id="st-failures-label"></span>
          </div>
          <div class="status-item">
            <span class="status-num" id="st-rewritten">0</span>
            <span class="status-key" id="st-rewritten-label"></span>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <button id="btn-settings" class="btn-link"></button>
      <button id="btn-visit" class="btn-link"></button>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
